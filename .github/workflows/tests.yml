name: tests

on:
  pull_request:

jobs:

  test:
    name: Run Tests
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: 'go.mod'

    - name: TestsGitHubService
      run: go test -coverprofile=tests_cover.html -v ./githubservice/...
